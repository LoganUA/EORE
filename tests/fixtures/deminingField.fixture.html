<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><title>deminingField.js test fixture</title></head>
<body>
<div id="app">
  <div class="screen-container">
    <div class="screen" id="screenDeminingField">
      <button id="backFromDeminingField">‹</button>
      <h2 id="deminingFieldHeader"></h2>
      <span id="dfCoinVal">0</span>
      <span id="dfAreaVal">0</span><span id="dfAreaLabel"></span>
      <span id="dfRemainingVal">0</span><span id="dfRemainingLabel"></span>
      <div id="dfFieldWrap" style="position:relative;">
        <div id="dfGrid"></div>
      </div>
      <div id="dfCompleteBanner"><span id="dfCompleteText"></span></div>
      <button id="dfBtnCatalog"></button>
      <button id="dfBtnRoster"></button>
      <button id="dfBtnNewField" style="display:none;"></button>
    </div>

    <div class="screen" id="screenThreatCatalog">
      <button id="backFromCatalog">‹</button>
      <h2 id="threatCatalogHeader"></h2>
      <span id="dfCatalogAreaVal">0</span><span id="dfCatalogAreaLabel"></span>
      <div id="dfCatalogList"></div>
    </div>

    <div class="screen" id="screenDeminerRoster">
      <button id="backFromRoster">‹</button>
      <h2 id="deminerRosterHeader"></h2>
      <div id="dfRosterList"></div>
      <button id="dfBtnHire"></button>
    </div>
  </div>

  <div class="overlay" id="dfReportOverlay">
    <div id="dfReportCard">
      <div id="dfReportTitle"></div>
      <div id="dfReportText"></div>
      <button id="dfReportClose"></button>
    </div>
  </div>
</div>
</body>
</html>
